<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking FIFA Amore</title>
<style>
body { font-family: Arial; background:#f0f4f8; color:#333; padding:20px;}
h1 { text-align:center; color:#0052B1; margin-bottom:20px;}
table { width:100%; border-collapse:collapse; box-shadow:0 5px 15px rgba(0,0,0,0.1);}
th,td { padding:12px; text-align:center; border-bottom:1px solid #ddd; transition:background 0.3s;}
th { background-color:#0052B1; color:white;}
tr:hover { background-color:#ffe600; cursor:pointer;}
input { width:60px; text-align:center; border:1px solid #ccc; border-radius:4px; padding:4px;}
.flag { width:20px; height:15px; vertical-align:middle; margin-right:5px;}
</style>
</head>
<body>

<h1>Ranking FIFA Amore</h1>
<table id="rankingTable">
<thead>
<tr><th>Rank</th><th>Negara</th><th>Poin</th></tr>
</thead>
<tbody></tbody>
</table>

<script>
const tableBody = document.querySelector('#rankingTable tbody');

// 100 negara + kode ISO
const countries = [
{name:"Argentina", code:"ar"}, {name:"Brazil", code:"br"}, {name:"Germany", code:"de"}, 
{name:"France", code:"fr"}, {name:"Spain", code:"es"}, {name:"England", code:"gb-eng"},
{name:"Belgium", code:"be"}, {name:"Netherlands", code:"nl"}, {name:"Portugal", code:"pt"},
{name:"Italy", code:"it"}, {name:"Uruguay", code:"uy"}, {name:"Croatia", code:"hr"},
{name:"Denmark", code:"dk"}, {name:"Mexico", code:"mx"}, {name:"Switzerland", code:"ch"},
{name:"Sweden", code:"se"}, {name:"Poland", code:"pl"}, {name:"Senegal", code:"sn"},
{name:"USA", code:"us"}, {name:"Wales", code:"gb-wls"}, {name:"Japan", code:"jp"},
{name:"South Korea", code:"kr"}, {name:"Cameroon", code:"cm"}, {name:"Morocco", code:"ma"},
{name:"Tunisia", code:"tn"}, {name:"Colombia", code:"co"}, {name:"Chile", code:"cl"},
{name:"Peru", code:"pe"}, {name:"Ecuador", code:"ec"}, {name:"Nigeria", code:"ng"},
{name:"Ghana", code:"gh"}, {name:"Ivory Coast", code:"ci"}, {name:"Serbia", code:"rs"},
{name:"Austria", code:"at"}, {name:"Turkey", code:"tr"}, {name:"Norway", code:"no"},
{name:"Scotland", code:"gb-sct"}, {name:"Ukraine", code:"ua"}, {name:"Russia", code:"ru"},
{name:"Czech Republic", code:"cz"}, {name:"Slovakia", code:"sk"}, {name:"Hungary", code:"hu"},
{name:"Romania", code:"ro"}, {name:"Bulgaria", code:"bg"}, {name:"Greece", code:"gr"},
{name:"Finland", code:"fi"}, {name:"Albania", code:"al"}, {name:"Lithuania", code:"lt"},
{name:"Latvia", code:"lv"}, {name:"Estonia", code:"ee"}, {name:"Australia", code:"au"},
{name:"New Zealand", code:"nz"}, {name:"Saudi Arabia", code:"sa"}, {name:"Iran", code:"ir"},
{name:"Iraq", code:"iq"}, {name:"Qatar", code:"qa"}, {name:"United Arab Emirates", code:"ae"},
{name:"China", code:"cn"}, {name:"Thailand", code:"th"}, {name:"Vietnam", code:"vn"},
{name:"Indonesia", code:"id"}, {name:"Malaysia", code:"my"}, {name:"Singapore", code:"sg"},
{name:"Philippines", code:"ph"}, {name:"Pakistan", code:"pk"}, {name:"India", code:"in"},
{name:"Bangladesh", code:"bd"}, {name:"Nepal", code:"np"}, {name:"Sri Lanka", code:"lk"},
{name:"Bhutan", code:"bt"}, {name:"Belarus", code:"by"}, {name:"Slovenia", code:"si"},
{name:"Bosnia & Herzegovina", code:"ba"}, {name:"Montenegro", code:"me"}, {name:"North Macedonia", code:"mk"},
{name:"Kosovo", code:"xk"}, {name:"Moldova", code:"md"}, {name:"Luxembourg", code:"lu"},
{name:"Liechtenstein", code:"li"}, {name:"Iceland", code:"is"}, {name:"Malta", code:"mt"},
{name:"Cyprus", code:"cy"}, {name:"Faroe Islands", code:"fo"}, {name:"Armenia", code:"am"},
{name:"Azerbaijan", code:"az"}, {name:"Georgia", code:"ge"}, {name:"Kazakhstan", code:"kz"},
{name:"Kyrgyzstan", code:"kg"}, {name:"Uzbekistan", code:"uz"}, {name:"Tajikistan", code:"tj"},
{name:"Afghanistan", code:"af"}, {name:"Syria", code:"sy"}, {name:"Lebanon", code:"lb"},
{name:"Jordan", code:"jo"}, {name:"Palestine", code:"ps"}, {name:"Oman", code:"om"},
{name:"Kuwait", code:"kw"}, {name:"Bahrain", code:"bh"}, {name:"Yemen", code:"ye"},
{name:"Honduras", code:"hn"}, {name:"Costa Rica", code:"cr"}, {name:"Panama", code:"pa"},
{name:"Jamaica", code:"jm"}, {name:"Trinidad & Tobago", code:"tt"}
];

// Ambil saved points, jika kosong pakai {}
let savedPoints = JSON.parse(localStorage.getItem('fifaPoints')) || {};
let data = countries.map(item => ({
  name: item.name,
  code: item.code,
  points: savedPoints[item.name] !== undefined ? savedPoints[item.name] : 0
}));

function renderTable() {
  data.sort((a,b)=>b.points-a.points);
  tableBody.innerHTML='';
  data.forEach((item,index)=>{
    const row=document.createElement('tr');
    const rankCell=document.createElement('td'); rankCell.textContent=index+1;
    const countryCell=document.createElement('td');
    const flagImg=document.createElement('img');
    flagImg.src=`https://flagcdn.com/20x15/${item.code.toLowerCase()}.png`;
    flagImg.className='flag'; flagImg.alt=item.name;
    countryCell.appendChild(flagImg);
    countryCell.appendChild(document.createTextNode(item.name));
    const pointCell=document.createElement('td');
    const input=document.createElement('input');
    input.type='number'; input.value=item.points;
    input.addEventListener('input',(e)=>{
      item.points=parseInt(e.target.value)||0;
      savedPoints[item.name]=item.points;
      localStorage.setItem('fifaPoints',JSON.stringify(savedPoints));
      renderTable();
    });
    pointCell.appendChild(input);
    row.appendChild(rankCell);
    row.appendChild(countryCell);
    row.appendChild(pointCell);
    tableBody.appendChild(row);
  });
}

renderTable();
</script>

</body>
</html>
